[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option_lib"
# Bump this whenever the public API changes — a new function, or a changed
# signature on an existing one.  The sibling apps install option_lib by path
# (`pip install ../../option_lib`), and pip skips a path install whose version
# already matches what is installed.  Leaving the version alone therefore ships
# an app that calls an API its deployed copy of the library does not have, and
# the failure surfaces as an ImportError at worker startup, not at deploy time.
version = "1.2.1"
description = "Shared option pricing and market data library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.28",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: marks tests that require live network access (deselect with '-m not network')",
]
