[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option_lib"
version = "0.1.0"
description = "Shared option pricing and market data library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.28",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
]
